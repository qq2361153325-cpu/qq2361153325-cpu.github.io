      <stop offset="0.54" stop-color="#141313"/>
      <stop offset="1" stop-color="#210b0d"/>
    </linearGradient>
    <radialGradient id="redGlow">
      <stop offset="0" stop-color="#d92d36" stop-opacity=".9"/>
      <stop offset=".38" stop-color="#a4141e" stop-opacity=".34"/>
      <stop offset="1" stop-color="#53080e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0" stop-color="#f3c887" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#c78a38" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8e511d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ede4d8"/><stop offset=".18" stop-color="#5b5652"/>
      <stop offset=".48" stop-color="#f3eee8"/><stop offset=".72" stop-color="#4d4845"/>
      <stop offset="1" stop-color="#e5ddd4"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c9c1b7"/><stop offset=".35" stop-color="#5d5955"/>
      <stop offset="1" stop-color="#242322"/>
