    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="tinySoft"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="mainScreen"><rect x="691" y="161" width="818" height="552" rx="9"/></clipPath>
  </defs>

